# Déploiement automatique sur la VM Oracle Cloud Free Tier
# Se déclenche à chaque push sur la branche main.
# Secrets requis (Settings → Secrets and variables → Actions) :
#   - ORACLE_HOST   : IP publique de la VM
#   - ORACLE_SSH_KEY: clé privée SSH dédiée au déploiement

name: Deploy K4ZK-BOT

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mettre à jour et redémarrer le bot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/KAZOKU-BOT
            git pull origin main
            venv/bin/pip install -r requirements.txt --quiet
            sudo systemctl restart k4zkbot
            sleep 3
            sudo systemctl status k4zkbot --no-pager
